name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Enables Pages for THIS repository and exposes its base_path / origin.
      # No repository name, owner, or URL is hardcoded anywhere.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          STATIC_BUILD: "true"
          # base_path is "" for <owner>.github.io repos and "/<repo>" otherwise.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build:static

      - name: Verify Pages base path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, readdirSync, statSync } from "node:fs";
          import { join } from "node:path";

          const root = "dist/client";
          const expected = process.env.PAGES_BASE_PATH;
          if (!expected) throw new Error("GitHub Pages did not provide a base path");

          const files = [];
          const walk = (directory) => {
            for (const entry of readdirSync(directory)) {
              const path = join(directory, entry);
              if (statSync(path).isDirectory()) walk(path);
              else if (/\.(?:html|css|js|json|xml|txt)$/.test(path)) files.push(path);
            }
          };
          walk(root);

          const escapedBase = expected.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const rootAsset = new RegExp(`(?:href|src)=["']\\/(?!\\/|${escapedBase.slice(1)}|__l5e\\/)`);
          for (const file of files) {
            const content = readFileSync(file, "utf8");
            if (rootAsset.test(content)) {
              throw new Error(`Root-relative deployment URL found in ${file}`);
            }
          }

          const html = readFileSync(join(root, "index.html"), "utf8");
          if (!html.includes(expected)) {
            throw new Error(`Generated HTML does not reference Pages base path ${expected}`);
          }
          console.log(`Verified static artifact for ${expected}`);
          EOF

      - name: Prepare Pages artifact
        run: |
          # Bypass Jekyll so files/folders starting with "_" are served.
          touch dist/client/.nojekyll
          # SPA fallback so deep links and refreshes resolve via the router.
          if [ -f dist/client/_shell.html ]; then
            cp dist/client/_shell.html dist/client/404.html
          else
            cp dist/client/index.html dist/client/404.html
          fi
          ls -la dist/client

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Show live URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
