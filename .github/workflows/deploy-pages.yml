name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Enables Pages for THIS repository and exposes its base_path / origin.
      # No repository name, owner, or URL is hardcoded anywhere.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || { echo "Lockfile out of sync — regenerating"; rm -f package-lock.json; npm install; }
          else
            npm install
          fi

      - name: Build static site
        env:
          STATIC_BUILD: "true"
          # base_path is "" for <owner>.github.io repos and "/<repo>" otherwise.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build:static

      - name: Prepare Pages artifact
        run: |
          # Bypass Jekyll so files/folders starting with "_" are served.
          touch dist/client/.nojekyll
          # SPA fallback so deep links and refreshes resolve via the router.
          if [ -f dist/client/_shell.html ]; then
            cp dist/client/_shell.html dist/client/404.html
          else
            cp dist/client/index.html dist/client/404.html
          fi
          ls -la dist/client

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Show live URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
