name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via the official deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; queue instead of cancelling a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keep package-lock.json in sync with package.json, then install.
      # `npm ci` is used when the lockfile already matches; otherwise it is
      # regenerated so the build never fails on a stale lock.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || { echo "Lockfile out of sync — regenerating"; rm -f package-lock.json; npm install; }
          else
            npm install
          fi

      - name: Resolve Pages base path
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          # User/org sites (<owner>.github.io) are served from the domain root.
          if [ "$REPO" = "${OWNER,,}.github.io" ] || [ "$REPO" = "$OWNER.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        env:
          STATIC_BUILD: "true"
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build:static

      - name: Prepare Pages artifact
        run: |
          # Bypass Jekyll so files/folders starting with "_" are served.
          touch dist/client/.nojekyll
          # SPA fallback: unknown deep links load the client shell and are then
          # resolved by the router.
          if [ -f dist/client/_shell.html ]; then
            cp dist/client/_shell.html dist/client/404.html
          else
            cp dist/client/index.html dist/client/404.html
          fi
          ls -la dist/client

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
